# Vérifications automatiques à chaque envoi et à chaque demande de modification (pull request).
name: Vérifications
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Code et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t comptoir:ci .
      - name: Démarrage et santé
        run: |
          docker run -d --name comptoir -p 8080:8080 comptoir:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8080/api/health && exit 0; sleep 1; done
          docker logs comptoir; exit 1
