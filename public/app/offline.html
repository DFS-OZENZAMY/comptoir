<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17181C">
  <title>Hors ligne : Comptoir</title>
  <link rel="stylesheet" href="/assets/fonts.css">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #F4F4F1; color: #17181C; font-family: "Archivo", system-ui, sans-serif; text-align: center; }
    .box { max-width: 420px; }
    .logo { font-family: "Archivo Narrow", "Archivo", sans-serif; font-weight: 700; font-size: 34px; }
    .logo i { display: inline-block; width: 10px; height: 10px; margin-left: 5px; border-radius: 2px; background: #E4572E; }
    h1 { font-family: "Archivo Narrow", "Archivo", sans-serif; font-size: 40px; line-height: 1.05; margin: 28px 0 10px; }
    p { color: #6B6F78; line-height: 1.55; margin: 0 0 24px; }
    button { padding: 14px 22px; border: 0; border-radius: 8px; background: #E4572E; color: #fff; font: inherit; font-weight: 600; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">Comptoir<i></i></div>
    <h1>Vous êtes hors ligne</h1>
    <p>Comptoir a besoin d’internet pour enregistrer vos ventes et votre stock en toute sécurité. La page se recharge toute seule dès que la connexion revient.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
  </div>
  <script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
